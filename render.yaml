# Blueprint do Render (Dashboard → New → Blueprint → escolha este repositório).
# Cria o PostgreSQL e a API (Docker, pasta trabFinal/). O frontend fica na Vercel (pasta frontend/).
databases:
  - name: gym-db
    plan: free
    databaseName: gym
    user: gym
    ipAllowList: []          # só acesso pela rede interna do Render

services:
  - type: web
    name: gym-api
    runtime: docker
    plan: free
    rootDir: trabFinal
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass    # CD só depois que o GitHub Actions (CI) passar
    buildFilter:
      paths:
        - trabFinal/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # segredo aleatório gerado pelo Render
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"                # 'prisma migrate deploy' ao iniciar
      - key: TRUST_PROXY
        value: "1"                   # proxy do Render à frente
      - key: EXPOSE_INSTANCE_ID
        value: "true"
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: CORS_ORIGINS
        sync: false                  # preencher com a URL da Vercel (ex.: https://gym-xyz.vercel.app)
      - key: SEED_ADMIN_EMAIL
        value: admin@gym.local
      - key: SEED_ADMIN_PASSWORD
        sync: false                  # senha do admin inicial (>= 10 caracteres); o seed roda ao iniciar
