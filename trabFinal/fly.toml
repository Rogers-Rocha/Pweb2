# Deploy no Fly.io (várias réplicas = várias "machines" atrás do proxy/load balancer da Fly).
# Troque o nome do app e a região se necessário. Segredos: veja README (fly secrets set ...).
app = "gym-api-CHANGE-ME"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  RUN_MIGRATIONS = "false"      # migrações rodam no release_command abaixo (uma vez por deploy)
  TRUST_PROXY = "1"
  EXPOSE_INSTANCE_ID = "true"   # permite demonstrar o balanceamento via X-Instance-Id
  CACHE_TTL_SECONDS = "60"

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2      # >= 2 réplicas sempre ativas

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
