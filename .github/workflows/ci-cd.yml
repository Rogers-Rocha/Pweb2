# CI/CD da Gym API (pasta trabFinal/).
# Este arquivo PRECISA ficar na raiz do repositório: .github/workflows/ci-cd.yml
#
# CI  -> este workflow: migrações em Postgres limpo, checagem de drift, typecheck, testes, build e imagem Docker.
# CD  -> Render (API, render.yaml na raiz) + Vercel (frontend/). Ambos fazem deploy automático da main.
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "trabFinal/**"
      - "frontend/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "trabFinal/**"
      - "frontend/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: trabFinal

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: Build, testes e migrações
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_ci_password
          POSTGRES_DB: gym
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gym -d gym"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gym:gym_ci_password@localhost:5432/gym?schema=public
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trabFinal/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - name: Aplicar migrações em banco limpo
        run: npx prisma migrate deploy
      - name: Garantir que o schema.prisma e as migrações estão em sincronia
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (unitários + pipeline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: trabFinal
          push: false
          tags: gym-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
